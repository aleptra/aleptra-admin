<nav class="sidebar">
  <form form-filter="true">
    <div class="md_du">
      <a click="toggle" keyboard-key="m" keyboard-action="click" keyboard-scope="body" clicktargetfield="aside[0]"
        class="button pl1"><i class="icon32">&#171;</i></a>
      <hr>
      <input id="query2" class="bs1 p1 h3 bcblack w100" bindvar="link" type="text" placeholder="Search for {link} ..."
        autocomplete="off">
    </div>
    <select name="db" class="p1 h3 mb1 shade1 fs08" onvaluechange="globalize-set">
      <option selected disabled globalize-get>Choose server</option>
      <option value="sv">localhost</option>
    </select>

    <section data-src="https://api.aleptra.com"
      data-iterate="databases">
      <details>
        <summary data-get="name"></summary>
        <nav
          data-iterate="tables"
          >
          <a data-get="name" data-set="name:name" href="table.html?i={name}" target="main">{name}</a>
        </nav>
      </details>
    </section>
  </form>
</nav>
